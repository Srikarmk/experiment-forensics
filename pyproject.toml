[project]
name = "experiment-forensics"
version = "0.1.0"
description = "How much do analysis choices change an A/B test's answer? Upworthy and Hillstrom re-analysis."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
forensics = "forensics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forensics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
